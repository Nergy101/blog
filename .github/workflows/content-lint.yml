name: Blog content checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  content-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check frontmatter, image alt text, and local links
        run: deno task content:check
      - name: Verify static build
        run: deno task build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate RSS/Atom feeds with the W3C Feed Validator
        run: |
          pip install html5lib rdflib
          git clone --depth 1 https://github.com/w3c/feedvalidator.git /tmp/feedvalidator
          PYTHONPATH=/tmp/feedvalidator/src python scripts/validate_feeds.py
      - name: Run Blog tests
        run: deno task test
